name: android
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - name: Rust core -> .so
        env:
          SNIFF_API_ID: ${{ secrets.TGKIKU_API_ID }}
          SNIFF_API_HASH: ${{ secrets.TGKIKU_API_HASH }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release -p sniff-ffi
      - name: Kotlin bindings
        run: cargo run -p uniffi-bindgen -- generate --library target/aarch64-linux-android/release/libsniff_ffi.so --language kotlin --no-format --out-dir android/app/src/main/java
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Signing key
        run: echo "${{ secrets.SIGN_KEYSTORE_B64 }}" | base64 -d > android/app/release.jks
      - run: gradle -p android assembleDebug
        env:
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with: { name: sniff-debug, path: android/app/build/outputs/apk/debug/app-debug.apk }
