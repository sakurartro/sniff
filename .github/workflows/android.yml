name: android
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'assets/**']
    # a version tag (1.0.0) ships a draft release; branch pushes only build the artifact
    tags: ['*.*.*']
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "apk-${{ github.ref }}", cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p sniff-core
      - run: cargo install cargo-ndk --locked
      - name: Rust core -> .so
        env:
          SNIFF_API_ID: ${{ secrets.TGKIKU_API_ID }}
          SNIFF_API_HASH: ${{ secrets.TGKIKU_API_HASH }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release -p sniff-ffi
      - name: Kotlin bindings
        run: cargo run -p uniffi-bindgen -- generate --library target/aarch64-linux-android/release/libsniff_ffi.so --language kotlin --no-format --out-dir android/app/src/main/java
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: 8.10.2 }
      - name: Signing key
        # without the secret there is no keystore and gradle falls back to the debug key
        env:
          KS: ${{ secrets.SIGN_KEYSTORE_B64 }}
        run: if [ -n "$KS" ]; then echo "$KS" | base64 -d > android/app/release.jks; fi
      - run: gradle -p android assembleRelease
        env:
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
      - uses: actions/upload-artifact@v5
        with:
          name: sniff
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
  release:
    # tags only; the APK built above is attached to a DRAFT release that is published by hand on GitHub
    if: github.ref_type == 'tag'
    needs: apk
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v5
        with: { name: sniff }
      - run: mv app-release.apk sniff.apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" sniff.apk --repo "${{ github.repository }}" --draft --verify-tag --title "sniff ${{ github.ref_name }}" --generate-notes
